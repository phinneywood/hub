[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "jinja2", "python-multipart",
                "pydantic-ai-slim[anthropic,openrouter,ui]==2.66.0"]

[tool.setuptools.packages.find]
include = ["hub*", "preschool*"]

[tool.setuptools.package-data]
hub = ["templates/*.html", "templates/**/*.html", "static/*", "static/ask/*", "static/app/*", "static/app/fonts/*", "app/versions.json"]
preschool = ["templates/*.html", "templates/**/*.html", "static/*"]
