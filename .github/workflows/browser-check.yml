name: Browser check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Los_Angeles     # the made-up day is set in Hub's own time zone
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Hub's locked Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -q -r requirements.lock
      # The runner's own Node runs the check; only Playwright and its Chromium are fetched, at a pinned version.
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start the demo (made-up house, no key, throwaway data)
        run: |
          .venv/bin/python web/app/check/demo_server.py > "$RUNNER_TEMP/demo.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8912/app/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/demo.log"; exit 1
      - name: Run the browser check
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node web/app/check/check.cjs "$RUNNER_TEMP/shots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Demo log on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/demo.log"
