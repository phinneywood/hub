name: Propose macOS dependency wheelhouse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Propose exact macOS ARM64 wheels without installation
        run: python -I tools/macos_wheelhouse.py propose --requirements requirements.lock --output-dir "$RUNNER_TEMP/proposal"
      - name: Retain proposal for source review, never deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-proposal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proposal/wheelhouse.json
            ${{ runner.temp }}/proposal/requirements-hashed.lock
            ${{ runner.temp }}/proposal/macos-arm64-wheelhouse.tar
          if-no-files-found: error
          retention-days: 14
