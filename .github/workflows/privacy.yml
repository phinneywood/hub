name: Privacy scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Generic patterns only: the private word list never leaves the owner's Mac.
      - name: Scan tracked files for personal data and secrets
        run: python -I tools/privacy_scan.py --all --no-denylist
